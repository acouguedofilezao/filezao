<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Área Interna — Filezão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b; --bg2:#141416; --panel:#16161a;
  --red:#FF1A1A; --redDeep:#C20000; --green:#2fd06b; --greenDeep:#179a47;
  --cream:#F3ECE0; --muted:#9a948c; --gold:#E7B24B;
  --blue:#3a86ff;
  --line:rgba(255,255,255,.08); --glow:rgba(255,26,26,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(125% 95% at 50% 14%,var(--bg2),var(--bg) 64%);color:var(--cream);
  font-family:'Oswald',system-ui,Arial,sans-serif;overflow:hidden;height:100vh;font-weight:300}
.bg-glow{position:fixed;top:-18vh;left:50%;transform:translateX(-50%);width:80vw;height:55vh;
  background:radial-gradient(circle,var(--glow),transparent 62%);filter:blur(30px);opacity:.3;pointer-events:none}
.bg-lines{position:fixed;inset:0;background:repeating-linear-gradient(118deg,transparent 0 84px,var(--line) 84px 86px);
  opacity:.5;pointer-events:none}
.wrap{position:relative;height:100vh;display:flex;flex-direction:column;
  padding:calc(1.6vh + env(safe-area-inset-top,0px)) 2.6vw calc(1.4vh + env(safe-area-inset-bottom,0px))}

header{display:flex;align-items:center;justify-content:space-between;gap:2vw;flex:0 0 auto;margin-bottom:1.2vh}
.brand{display:flex;align-items:center;gap:1.1vw;min-width:0}
.brandlogo{height:11vh;width:auto;filter:drop-shadow(0 0 1.2vh var(--glow))}
.brand .bt .ey{font-size:1.6vh;letter-spacing:.26vw;color:var(--muted);text-transform:uppercase;font-weight:500}
.brand .bt .ey i{color:var(--red);font-style:normal}
.brand .bt .n{font-family:'Anton';font-size:3.2vh;letter-spacing:.5px;color:var(--cream);line-height:1;text-transform:uppercase}
.hd-right{text-align:right;flex:0 0 auto}
.hd-right .sem{font-family:'Anton';font-size:3.2vh;color:var(--gold);letter-spacing:.5px}
.hd-right .dt{font-size:2.2vh;color:var(--muted);text-transform:uppercase;margin-top:.3vh}
.hd-right .hr{font-family:'Anton';font-size:3vh;color:var(--cream);margin-top:.2vh}

/* palco que troca de tela */
.stage{position:relative;flex:1 1 auto;min-height:0}
.view{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s ease;display:flex;flex-direction:column}
.view.active{opacity:1;pointer-events:auto}

/* ----- tela META ----- */
.board{flex:1 1 auto;display:flex;gap:2vw;min-height:0}
.col-meta{flex:1.45 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;min-width:0}
.col-meta .lbl{font-size:2.2vh;letter-spacing:.45vw;color:var(--muted);text-transform:uppercase;font-weight:500}
.vendas{font-family:'Anton';font-size:14vh;line-height:.9;letter-spacing:1px;color:var(--cream);transition:color .3s;text-align:center}
.vendas.flash{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.prog{width:100%;max-width:900px}
.prog .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.6vh;font-size:1.9vh}
.prog .top .pdone{color:var(--muted);text-transform:uppercase;letter-spacing:.04vw}
.prog .top .pdone b{font-family:'Anton';font-size:4vh;margin-right:.5vw}
.prog .top .pleft{color:var(--muted);text-transform:uppercase}
.prog .top .pleft b{font-family:'Anton';font-size:2.6vh;color:var(--muted)}
.track{height:3.2vh;background:rgba(255,255,255,.06);border:.18vh solid var(--line);border-radius:2vh;overflow:hidden}
.fill{height:100%;width:0%;border-radius:2vh;background:linear-gradient(90deg,var(--greenDeep),var(--green));
  box-shadow:0 0 2.2vh rgba(47,208,107,.45);transition:width .8s cubic-bezier(.22,1,.36,1)}
.fill.ok{background:linear-gradient(90deg,#b8860b,var(--gold));box-shadow:0 0 2.6vh rgba(231,178,75,.6)}
.falta{text-align:center;margin-top:.9vh;font-size:2.1vh;color:var(--muted)}
.falta b{font-family:'Anton';font-weight:400}
.bonus{margin-top:1.6vh;display:flex;align-items:center;gap:1vw;background:linear-gradient(90deg,#b8860b,var(--gold));color:#1a1206;
  font-family:'Anton';font-size:3.4vh;letter-spacing:.5px;padding:1.1vh 2.4vw;border-radius:1.4vh;text-transform:uppercase;
  box-shadow:0 0 3vh rgba(231,178,75,.55);animation:bonuspulse 1.8s ease-in-out infinite}
.bonus .ic{font-size:3.8vh}
@keyframes bonuspulse{0%,100%{transform:scale(1);box-shadow:0 0 2.4vh rgba(231,178,75,.45)}50%{transform:scale(1.04);box-shadow:0 0 4.4vh rgba(231,178,75,.8)}}
.col-notes{flex:1 1 0;display:flex;flex-direction:column;min-width:0;
  background:rgba(255,255,255,.03);border:.2vh solid var(--line);border-radius:1.6vh;padding:1.4vh 1.4vw}
.col-notes .t{font-family:'Anton';font-size:2.7vh;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;margin-bottom:1vh}
#nota-view{flex:1 1 auto;overflow:auto;white-space:pre-wrap;font-size:3.6vh;line-height:1.4;color:var(--cream);font-weight:400}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:.9vw;flex:0 0 auto;margin-top:1.2vh}
.dia{background:rgba(255,255,255,.03);border:.18vh solid var(--line);border-radius:1.2vh;padding:.9vh .4vw;text-align:center}
.dia .dn{font-family:'Anton';font-size:1.85vh;letter-spacing:.5px;color:var(--cream)}
.dia .dd{font-size:1.25vh;color:var(--muted);margin:.15vh 0 .4vh}
.dia .dv{font-family:'Anton';font-size:2.2vh;line-height:1}
.dia .dv.pos{color:var(--green)} .dia .dv.zero{color:var(--muted)}
.dia.hoje{border-color:var(--red);box-shadow:0 0 2.2vh var(--glow);background:rgba(255,26,26,.07)}
.dia.fut{opacity:.42}

/* ----- tela ESCALA ----- */
.esc-grid{flex:1 1 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(20vw,1fr));
  grid-auto-rows:min-content;gap:1.3vh 1vw;align-content:start;overflow:auto;padding-right:.4vw}
.esc-card{background:rgba(255,255,255,.03);border:.18vh solid var(--line);border-radius:1.3vh;padding:1.2vh 1.1vw;
  display:flex;flex-direction:column;gap:.4vh}
.esc-card.hoje{border-color:var(--blue);box-shadow:0 0 2.4vh rgba(58,134,255,.5);background:rgba(58,134,255,.1)}
.esc-card.hoje .ed{color:var(--blue)} .esc-card.hoje .en{color:#cfe2ff}
.esc-card.prox{border-color:var(--green);box-shadow:0 0 2.4vh rgba(47,208,107,.45);background:rgba(47,208,107,.09)}
.esc-card.prox .ed{color:var(--green)} .esc-card.prox .en{color:#c7eed2}
.esc-card .badge{margin-left:auto;font-size:1.35vh;font-weight:700;letter-spacing:.05vw;text-transform:uppercase;padding:.4vh .7vw;border-radius:1vh;white-space:nowrap}
.esc-card.hoje .badge{background:var(--blue);color:#fff} .esc-card.prox .badge{background:var(--green);color:#06210f}
.esc-card.passado{opacity:.38}
.esc-card.passado .ed,.esc-card.passado .ew,.esc-card.passado .en{text-decoration:line-through}
.esc-card .top{display:flex;align-items:center;gap:.7vw}
.esc-card .ed{font-family:'Anton';font-size:3.2vh;color:var(--gold);line-height:1}
.esc-card .ew{font-size:1.6vh;color:var(--muted);text-transform:uppercase;letter-spacing:.04vw}
.esc-card .en{font-size:2.5vh;color:var(--cream);font-weight:500;line-height:1.25}
.esc-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:2.4vh;font-style:italic}
.esc-cals{flex:1 1 auto;display:flex;min-height:0;overflow:hidden}
.cal-card{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;background:#fff;border-radius:1.8vh;padding:1.6vh 1.3vw;box-shadow:0 1.2vh 4vh rgba(0,0,0,.45)}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:1vw;margin-bottom:1vh;flex-wrap:wrap}
.cal-card .cal-tt{font-family:'Anton';font-size:2.7vh;color:#1a1a1a;text-align:left;letter-spacing:.5px;text-transform:uppercase;margin-bottom:0;white-space:nowrap}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:.6vh .5vw;margin-bottom:.6vh}
.cal-head div{text-align:center;font-family:'Anton';font-size:1.95vh;color:#fff;background:var(--redDeep);border-radius:.7vh;padding:.6vh 0;text-transform:uppercase}
.cal-head div.wd{background:#7c8794}
.cal-grid{flex:1 1 auto;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:.6vh .5vw}
.cal-cell{position:relative;background:#f6f6f8;border:.15vh solid #e4e4e8;border-radius:1vh;padding:.7vh .55vw;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cal-cell.vazio{background:transparent;border-color:transparent}
.cal-cell.fds{background:#e8ecf2}
.cal-cell .dnum{font-family:'Anton';font-size:2.5vh;color:#555;line-height:1}
.cal-cell .nomes{margin-top:.4vh;display:flex;flex-direction:column;gap:.2vh;overflow:hidden}
.cal-cell .fer{font-size:1.5vh;color:#C20000;font-weight:700;line-height:1.08;margin-top:.25vh;white-space:normal;overflow:hidden}
.cal-cell.aniver{outline:.32vh solid #d6336c;outline-offset:-.32vh;box-shadow:0 0 1.5vh rgba(214,51,108,.45)}
.cal-cell .aniv{font-size:1.55vh;color:#c2185b;font-weight:800;line-height:1.12;margin-top:.2vh;white-space:normal;overflow:hidden;text-transform:uppercase}
.cal-cell .nm{font-size:2.1vh;line-height:1.16;color:#1a1a1a;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.cal-cell.outro{background:#f7f8fa}
.cal-cell.feriado{background:#fde9e9}
.cal-cell.tem{background:#fff5db}
.cal-cell.outro .dnum{color:#b9bec5}
.cal-cell.outro .fer{color:#d49a9a}
.cal-cell.outro .nm{color:#aab0b8;font-weight:600}
.cal-cell.hoje{background:#e7f0ff;border-color:#3a86ff;box-shadow:inset 0 0 0 .28vh #3a86ff}
.cal-cell.hoje .dnum{color:#1d4ed8} .cal-cell.hoje .nm{color:#1d4ed8}
.cal-cell.prox{background:#e6f8ee;border-color:#1f9d57;box-shadow:inset 0 0 0 .28vh #1f9d57}
.cal-cell.prox .dnum{color:#0f7a3d} .cal-cell.prox .nm{color:#0f7a3d}
.cal-cell.passou .dnum{color:#b3b7bd}
.cal-cell.passou::after{content:'✓';position:absolute;top:.5vh;right:.55vw;font-size:2.1vh;font-weight:900;color:#1f9d57;line-height:1;text-shadow:0 0 .25vh #fff}
.cal-cell.passado .nm{color:#0f7a3d;font-weight:700;text-decoration:none}
.cal-legend{display:flex;justify-content:flex-end;align-items:center;gap:1vw;flex-wrap:wrap;row-gap:.4vh}
.cal-legend .lg{font-size:1.65vh;color:#444;font-weight:600;display:flex;align-items:center;gap:.4vw}
.cal-legend .lg::before{content:'';width:1.5vh;height:1.5vh;border-radius:.3vh;display:inline-block}
.cal-legend .lg.blue::before{background:#3a86ff} .cal-legend .lg.green::before{background:#1f9d57}
.cal-legend .lg.red::before{background:#C20000} .cal-legend .lg.gray::before{background:#7c8794} .cal-legend .lg.lgray::before{background:#dfe3e9;border:.13vh solid #cfd4db}

footer{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:2vw;margin-top:1.1vh;
  border-top:.18vh solid var(--line);padding-top:.9vh}
footer .rule{font-size:1.6vh;color:var(--muted)}
footer .rule b{color:var(--gold);font-weight:600}
footer .verse{font-size:1.95vh;color:var(--gold);font-style:italic;font-weight:500}
footer .verse span{color:var(--muted);font-style:normal;font-size:1.5vh}
footer .st{font-size:1.5vh;color:var(--muted);text-align:right;white-space:nowrap}
footer .st i{color:var(--green);font-style:normal}
.dots{display:flex;gap:1.1vw;align-items:center;justify-content:center}
.dots .d{height:1.7vh;width:1.7vh;border-radius:999px;background:rgba(255,255,255,.18);border:none;padding:0;cursor:pointer;transition:all .3s cubic-bezier(.6,0,.2,1)}
.dots .d:hover,.dots .d:focus{background:var(--cream);transform:scale(1.22);box-shadow:0 0 1.4vh var(--glow);outline:none}
.dots .d.on{width:5vh;background:var(--red);box-shadow:0 0 1.6vh var(--glow)}

@media(max-width:820px){
  .board{flex-direction:column;gap:1.2vh}
  .brandlogo{height:8vh}.brand .bt .n{font-size:2.5vh}
  .vendas{font-size:11vh}.col-notes{min-height:20vh}
  #nota-view{font-size:2.8vh}.dias{grid-template-columns:repeat(4,1fr)}
  .esc-cals{flex-direction:column}
  footer{flex-direction:column;align-items:flex-start;gap:.5vh}footer .st{text-align:left}
}
</style>
</head>

<script>
/* ===== ÁREA INTERNA — Casa de Carnes Filezão =====
   Alterna a cada 30s entre: (1) META + ANOTAÇÕES e (2) ESCALA DE FOLGA do mês.
   Tudo vem do sistema (tabela config no Supabase): meta_semanal, anotacoes, escala. */

const SB_URL='https://vfrgqtuvbflkexapdzho.supabase.co';
const SB_KEY='sb_publishable_mDc22ezigbtBUR30-Fi5yA_sm9rKSX5';
const HDR={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
const REFRESH_MS=15000;     /* recarrega dados a cada 15s */
const ROTACAO_MS=30000;     /* troca de tela a cada 30s */

var META=0, ESCALA=[], FUNCS=[];
var DIAS_SEM=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function z(n){return (n<10?'0':'')+n;}
function agoraBR(){try{return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Sao_Paulo'}));}catch(e){return new Date();}}
function ymd(d){return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function ddmm(d){return z(d.getDate())+'/'+z(d.getMonth()+1);}
var BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
function money(v){return BRL.format(v||0);}
function horaBR(){var d=agoraBR();return z(d.getHours())+':'+z(d.getMinutes())+':'+z(d.getSeconds());}
function dataDeStr(s){return new Date(s+'T12:00:00');} /* meio-dia evita problema de fuso */

/* ===== semana SEG->DOM ===== */
function semana(){
  var hoje=agoraBR();var dow=hoje.getDay();var diff=(dow===0)?-6:(1-dow);
  var seg=new Date(hoje);seg.setDate(hoje.getDate()+diff);seg.setHours(0,0,0,0);
  var dias=[];for(var i=0;i<7;i++){var d=new Date(seg);d.setDate(seg.getDate()+i);dias.push(d);}
  var prox=new Date(dias[6]);prox.setDate(dias[6].getDate()+1);
  return {ws:ymd(dias[0]),we:ymd(dias[6]),weLt:ymd(prox),dias:dias,hoje:ymd(hoje)};
}

function valEnt(r){
  if(r.valor!=null)return parseFloat(r.valor)||0;
  if(r.total!=null)return parseFloat(r.total)||0;
  var s=0,ks=['dinheiro','pix','cartao','cartão','credito','debito'];
  for(var i=0;i<ks.length;i++){if(r[ks[i]]!=null)s+=parseFloat(r[ks[i]])||0;}
  return s;
}
function dt(r){return r.data||r.date||r.dia||r.dt||'';}
async function fetchEntradas(ws,weLt){
  try{var r=await fetch(SB_URL+'/rest/v1/entradas?data=gte.'+ws+'&data=lt.'+weLt+'&select=*',{headers:HDR});if(r.ok)return await r.json();}catch(e){}
  return null;
}

/* ===== config: meta, anotações, escala ===== */
async function lerConfig(){
  try{
    var r=await fetch(SB_URL+'/rest/v1/config?chave=in.(meta_semanal,anotacoes,escala,bonus,funcionarios)&select=chave,valor',{headers:HDR});
    if(r.ok){var a=await r.json(),map={};a.forEach(function(x){map[x.chave]=x.valor;});
      var esc=[];try{if(map.escala)esc=JSON.parse(map.escala)||[];}catch(e){}
      var fnc=[];try{if(map.funcionarios)fnc=JSON.parse(map.funcionarios)||[];}catch(e){}
      return {meta:(map.meta_semanal!=null?parseFloat(String(map.meta_semanal).replace(',','.'))||0:null),
              nota:(map.anotacoes!=null?map.anotacoes:null), escala:esc,
              bonus:(map.bonus!=null?parseFloat(String(map.bonus).replace(',','.'))||0:0), func:fnc};}
  }catch(e){}
  return null;
}

/* ===== render META ===== */
function setBig(v){
  var el=document.getElementById('vendas');var txt=money(v);
  if(el.textContent!==txt){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}
  el.textContent=txt;
}
function renderProgresso(vendas){
  var big=document.getElementById('vendas'),done=document.getElementById('pctdone'),left=document.getElementById('pctleft'),
      fill=document.getElementById('fill'),falta=document.getElementById('falta');
  if(!(META>0)){big.textContent='R$ 0,00';done.textContent='0%';left.textContent='100%';done.style.color='var(--muted)';
    fill.style.width='0%';falta.textContent='Defina a meta no sistema';falta.style.color='var(--muted)';return;}
  setBig(META);
  var pct=vendas/META*100;var p=Math.max(0,Math.min(100,pct));
  var hue=Math.round(p/100*120);var cor='hsl('+hue+',82%,46%)';
  done.textContent=Math.round(pct)+'%';done.style.color=cor;
  left.textContent=Math.max(0,Math.round(100-pct))+'%';
  fill.style.width=p+'%';fill.style.background=cor;fill.style.boxShadow='0 0 18px '+cor;
  if(vendas>=META){falta.innerHTML='✓ <b>META BATIDA!</b>';falta.style.color='var(--gold)';}
  else falta.textContent='';
}
async function carregarMeta(){
  var s=semana();
  var ent=await fetchEntradas(s.ws,s.weLt);
  if(ent===null){document.getElementById('status').textContent='sem conexão — tentando de novo…';return;}
  var tot=0,porDia={};
  ent.forEach(function(r){var v=valEnt(r);tot+=v;var k=dt(r);porDia[k]=(porDia[k]||0)+v;});
  renderProgresso(tot);
  document.getElementById('status').innerHTML='<i>●</i> atualizado às '+horaBR();
}

/* ===== render ESCALA (mês atual) ===== */
function mapMesAtual(){
  var hoje=agoraBR();var pref=hoje.getFullYear()+'-'+z(hoje.getMonth()+1);var mp={};
  (ESCALA||[]).forEach(function(e){if(!e||!e.data||!e.nome)return;if(String(e.data).slice(0,7)!==pref)return;(mp[e.data]=mp[e.data]||[]).push(e.nome);});
  return mp;
}
function diasNoMes(y,m){return new Date(y,m+1,0).getDate();}

/* ===== Feriados (nacionais + MG + Perdigão), com móveis calculados pela Páscoa ===== */
function pascoa(y){
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
      f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),hh=(19*a+b-d-g+15)%30,
      ii=Math.floor(c/4),k=c%4,l=(32+2*e+2*ii-hh-k)%7,mm=Math.floor((a+11*hh+22*l)/451),
      mes=Math.floor((hh+l-7*mm+114)/31),dia=((hh+l-7*mm+114)%31)+1;
  return new Date(y,mes-1,dia);
}
function addDias(dt,n){var x=new Date(dt);x.setDate(x.getDate()+n);return x;}
function feriadosDoAno(y){
  var f={};function set(dt,nome){f[ymd(dt)]=nome;}
  set(new Date(y,0,1),'Ano Novo');
  set(new Date(y,3,21),'Tiradentes');
  set(new Date(y,4,1),'Dia do Trabalho');
  set(new Date(y,7,15),'Feriado Municipal');
  set(new Date(y,8,7),'Independência');
  set(new Date(y,9,12),'N. Sra. Aparecida');
  set(new Date(y,10,2),'Finados');
  set(new Date(y,10,15),'Proclamação Rep.');
  if(y>=2024)set(new Date(y,10,20),'Consciência Negra');
  set(new Date(y,11,8),'Feriado Municipal');
  set(new Date(y,11,12),'Aniv. de Perdigão');
  set(new Date(y,11,25),'Natal');
  var pa=pascoa(y);
  set(addDias(pa,-48),'Carnaval');
  set(addDias(pa,-47),'Carnaval');
  set(addDias(pa,-46),'Quarta de Cinzas');
  set(addDias(pa,-2),'Sexta-feira Santa');
  set(addDias(pa,60),'Corpus Christi');
  return f;
}

function allFolgas(){
  var mp={};
  (ESCALA||[]).forEach(function(e){if(!e||!e.data||!e.nome)return;(mp[e.data]=mp[e.data]||[]).push(e.nome);});
  return mp;
}
function renderEscala(){
  var cont=document.getElementById('esc-cals');if(!cont)return;
  var hoje=agoraBR();var y=hoje.getFullYear(),m=hoje.getMonth();var hojeS=ymd(hoje);
  var fmap=allFolgas();
  var anivMap={};(FUNCS||[]).forEach(function(f){if(f&&f.nasc&&f.nome){var mm=String(f.nasc).slice(5,10);(anivMap[mm]=anivMap[mm]||[]).push(f.nome);}});
  var datas=Object.keys(fmap).sort();
  var proxS='';for(var i=0;i<datas.length;i++){if(datas[i]>hojeS){proxS=datas[i];break;}}
  var ferCache={};function ferDe(yy){if(!ferCache[yy])ferCache[yy]=feriadosDoAno(yy);return ferCache[yy];}
  cont.innerHTML='';
  var card=document.createElement('div');card.className='cal-card';
  var top=document.createElement('div');top.className='cal-top';
  var tt=document.createElement('div');tt.className='cal-tt';tt.textContent=(MESES[m]+' '+y).toUpperCase();top.appendChild(tt);
  var lg=document.createElement('div');lg.className='cal-legend';
  lg.innerHTML='<span class="lg blue">Folga hoje</span><span class="lg green">Próxima folga</span><span class="lg red">Feriado</span><span class="lg gray">Sáb / Dom</span><span class="lg lgray">Outro mês</span>';
  top.appendChild(lg);
  card.appendChild(top);
  var head=document.createElement('div');head.className='cal-head';
  ['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].forEach(function(n,ix){var c=document.createElement('div');c.textContent=n;if(ix>=5)c.className='wd';head.appendChild(c);});
  card.appendChild(head);
  var grid=document.createElement('div');grid.className='cal-grid';
  var off=(new Date(y,m,1).getDay()+6)%7;
  var N=diasNoMes(y,m);
  var linhas=Math.ceil((off+N)/7);var celulas=linhas*7;
  var ini=new Date(y,m,1);ini.setDate(ini.getDate()-off);
  for(var k=0;k<celulas;k++){
    var cur=new Date(ini);cur.setDate(ini.getDate()+k);
    var ds=ymd(cur);var col=k%7;var noMes=(cur.getMonth()===m&&cur.getFullYear()===y);
    var nomes=fmap[ds]||null;var ferNome=ferDe(cur.getFullYear())[ds]||null;var anivs=anivMap[ds.slice(5,10)]||null;
    var cls='cal-cell'+(noMes?'':' outro');
    if(col>=5)cls+=' fds';
    if(anivs)cls+=' aniver';
    if(noMes){
      if(ferNome)cls+=' feriado';
      if(nomes)cls+=' tem';
      if(ds===hojeS)cls+=' hoje';
      else if(ds<hojeS){cls+=' passou';if(nomes)cls+=' passado';}
      else if(nomes&&ds===proxS)cls+=' prox';
    }else if(ds===proxS){cls+=' prox';}
    var cell=document.createElement('div');cell.className=cls;
    var html='<div class="dnum">'+cur.getDate()+'</div>';
    if(anivs)html+='<div class="aniv">\uD83C\uDF82 '+anivs.map(function(n){return (n+'').replace(/</g,'&lt;');}).join(', ')+'</div>';
    if(ferNome)html+='<div class="fer">'+ferNome.replace(/</g,'&lt;')+'</div>';
    if(nomes)html+='<div class="nomes">'+nomes.map(function(n){return '<div class="nm">'+n.replace(/</g,'&lt;')+'</div>';}).join('')+'</div>';
    cell.innerHTML=html;grid.appendChild(cell);
  }
  card.appendChild(grid);
  cont.appendChild(card);
}
/* ===== troca de telas ===== */
var tela='meta';
function setScreen(nome){
  tela=nome;
  document.getElementById('view-meta').classList.toggle('active',nome==='meta');
  document.getElementById('view-escala').classList.toggle('active',nome==='escala');
  var hoje=agoraBR();
  if(nome==='meta'){
    document.getElementById('titulo').textContent='META DA SEMANA';
    var s=semana();document.getElementById('sub').textContent='SEMANA '+ddmm(s.dias[0])+' A '+ddmm(s.dias[6]);
  }else{
    document.getElementById('titulo').textContent='ESCALA DE FOLGA';
    document.getElementById('sub').textContent=(MESES[hoje.getMonth()]+' '+hoje.getFullYear()).toUpperCase();
    renderEscala();
  }
  renderDots();
}
var SCREENS=['meta','escala'];var _rotTimer=null;
function rotaciona(){ setScreen(tela==='meta'?'escala':'meta'); }
function renderDots(){
  var el=document.getElementById('dots');if(!el)return;
  var s='';for(var i=0;i<SCREENS.length;i++)s+='<button type="button" class="d'+(SCREENS[i]===tela?' on':'')+'" onclick="irParaTela('+i+')" aria-label="Tela '+(i+1)+'"></button>';
  el.innerHTML=s;
}
function irParaTela(i){
  if(i<0||i>=SCREENS.length)return;
  if(_rotTimer)clearInterval(_rotTimer);
  _rotTimer=setInterval(rotaciona,ROTACAO_MS);
  setScreen(SCREENS[i]);
}

/* ===== loop principal ===== */
async function carregar(){
  var cfg=await lerConfig();
  if(cfg){
    if(cfg.meta!=null)META=cfg.meta;
    if(cfg.escala)ESCALA=cfg.escala;
    if(cfg.func)FUNCS=cfg.func;
    document.getElementById('nota-view').textContent=(cfg.nota!=null?cfg.nota:'');
    var bEl=document.getElementById('bonus');
    if(cfg.bonus>0){bEl.style.display='flex';bEl.innerHTML='<span class="ic">🏆</span> Bônus da equipe: '+money(cfg.bonus);}
    else bEl.style.display='none';
  }
  await carregarMeta();
  if(tela==='escala')renderEscala();
}

function tick(){
  var d=agoraBR();
  document.getElementById('hora').textContent=horaBR();
  document.getElementById('data').textContent=DIAS_SEM[d.getDay()]+', '+ddmm(d);
}

tick();setInterval(tick,1000);
setScreen('meta');
carregar();setInterval(carregar,REFRESH_MS);
_rotTimer=setInterval(rotaciona,ROTACAO_MS);

/* ===== anti-sono (não deixa a tela apagar) ===== */
var _wakeLock=null;
function keepAwake(){var v=document.getElementById('nosleep');if(v){var pp=v.play();if(pp&&pp.catch)pp.catch(function(){});}if('wakeLock' in navigator && !_wakeLock){try{navigator.wakeLock.request('screen').then(function(w){_wakeLock=w;w.addEventListener('release',function(){_wakeLock=null;});}).catch(function(){});}catch(e){}}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){_wakeLock=null;keepAwake();}});
document.addEventListener('click',keepAwake);document.addEventListener('keydown',keepAwake);
document.addEventListener('keydown',function(e){var k=e.key||e.keyCode;if(k==='MediaPlayPause'||k==='MediaPlay'||k==='MediaPause'||k==='Pause'||k===179||k===415||k===19){if(typeof toggleMusic==='function')toggleMusic();}else if(k==='MediaTrackNext'||k==='MediaNextTrack'||k===176||k===425){if(typeof nextStation==='function')nextStation();}});
keepAwake();
setInterval(keepAwake,60000);
</script>
