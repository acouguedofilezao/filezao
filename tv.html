<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#TABELA FILEZÃO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b; --bg2:#141416; --panel:#16161a;
  --red:#FF1A1A; --redDeep:#C20000; --cream:#F3ECE0; --muted:#9a948c;
  --line:rgba(255,255,255,.08); --glow:rgba(255,26,26,.5);
  --bone:var(--cream); --ink:var(--panel);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(125% 95% at 50% 16%,var(--bg2),var(--bg) 64%);color:var(--cream);
  font-family:'Oswald',system-ui,Arial,sans-serif;overflow:hidden;height:100vh;font-weight:300}
img{display:block}

/* fundo cinematográfico */
.bg-glow{position:fixed;width:120vw;height:120vw;left:50%;top:48%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,var(--glow),transparent 62%);filter:blur(30px);opacity:.42;
  animation:glowDrift 18s ease-in-out infinite;pointer-events:none;z-index:0}
.bg-lines{position:fixed;inset:0;background:repeating-linear-gradient(118deg,transparent 0 84px,var(--line) 84px 86px);
  opacity:.6;pointer-events:none;z-index:0}
.bg-vig{position:fixed;inset:0;box-shadow:inset 0 0 22vw 5vw rgba(0,0,0,.9);pointer-events:none;z-index:1}

.wrap{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column}

/* ===== Cabeçalho ===== */
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:2vw;padding:2.6vh 3.2vw 1.4vh}
.brand{display:flex;align-items:center;gap:1.1vw;flex:1 1 auto;min-width:0}
.brandlogo{height:17.5vh;width:auto;filter:drop-shadow(0 0 1.4vh var(--glow))}
.brand .bt{line-height:1.05;min-width:0;overflow:hidden}
.brand .bt .ey{font-size:1.9vh;letter-spacing:.28vw;color:var(--muted);text-transform:uppercase;font-weight:500;margin-bottom:.4vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .bt .ey .hc{color:var(--red);font-style:normal}
.brand .bt .n{font-family:'Anton';font-size:4.3vh;letter-spacing:.5px;color:var(--cream);line-height:.98}
.brand .bt .n i{color:var(--red);font-style:normal}
.brand .bt .s{font-size:1.95vh;letter-spacing:.05vw;color:var(--muted);font-weight:400;margin-top:.45vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr-right{display:flex;align-items:center;gap:1.9vw;flex:0 0 auto}
.music{display:flex;align-items:center;gap:1vw;background:rgba(255,255,255,.04);border:.18vh solid var(--line);border-radius:1.6vh;padding:.9vh 1.1vw;width:25vw;min-width:25vw;flex:0 0 auto}
.music button{height:6.6vh;width:6.6vh;min-width:6.6vh;padding:0;border-radius:50%;border:.22vh solid var(--line);
  background:rgba(0,0,0,.28);color:var(--cream);font-size:2.7vh;line-height:1;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.music button:hover,.music button:focus{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 2.8vh var(--glow);transform:scale(1.07);outline:none}
.music .minfo{flex:1 1 auto;min-width:0;line-height:1.12}
.music .minfo small{display:block;font-size:1.45vh;letter-spacing:.18vw;color:var(--muted);text-transform:uppercase}
.music .minfo b{font-size:2vh;color:var(--cream);font-weight:600;line-height:1.14;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clockwrap{display:flex;flex-direction:column;align-items:flex-end;gap:.4vh}
.crow{display:flex;align-items:center;gap:1vw}
.aberto{display:inline-flex;align-items:center;gap:.55vw;font-size:1.4vh;letter-spacing:.25vw;color:var(--cream);font-weight:600;text-transform:uppercase}
.aberto i{width:1.05vh;height:1.05vh;border-radius:50%;background:var(--red);box-shadow:0 0 1.2vh var(--glow);animation:pulse 1.6s infinite}
.clock{font-family:'Anton';font-size:4.5vh;color:var(--cream);letter-spacing:1px;line-height:1}
.date{font-size:1.95vh;color:var(--muted);letter-spacing:.05vw;margin-top:.3vh}

/* ===== Palco ===== */
main{flex:1 1 auto;position:relative;min-height:0}
#stage{position:absolute;inset:1vh 3.2vw 1.2vh;opacity:1;transition:opacity .35s ease;overflow:hidden}
#stage.board{display:flex;flex-wrap:wrap;align-content:flex-start;gap:1.5vh 1.4vw}
#stage:not(.board){display:flex;align-items:center;justify-content:center}

/* categoria (cabeçalho dentro da grade) */
.brd-cat{width:100%;display:flex;align-items:center;gap:1vw;margin:.2vh 0 -.2vh}
.brd-cat .t{font-size:1.9vh;letter-spacing:.4vw;color:var(--red);font-weight:600;text-transform:uppercase;white-space:nowrap}
.brd-cat .ln{flex:1;height:2px;background:linear-gradient(90deg,var(--red),transparent)}

/* card de produto (estilo CORTES) */
.card{position:relative;width:calc(33.333% - .94vw);height:32vh;background:var(--panel);border:1px solid var(--line);
  border-radius:1.3vh;overflow:hidden;box-shadow:0 2.2vh 4.6vh rgba(0,0,0,.55);display:flex;flex-direction:column;animation:fadeUp .55s both}
.card .photo{position:relative;width:100%;flex:1 1 auto;min-height:0;background:radial-gradient(circle at 50% 40%,#16161a,#0c0c0e);overflow:hidden}
.card .photo img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;filter:saturate(1.06) contrast(1.04)}
.card .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#1b1b1f,#0f0f11)}
.card .tag{position:absolute;top:1vh;left:1vh;background:var(--red);color:#fff;font-family:'Anton';font-size:1.4vh;
  letter-spacing:1px;padding:.6vh 1vw;border-radius:.5vh;box-shadow:0 0 1.6vh var(--glow);z-index:2;text-transform:uppercase;font-size:1.8vh}
.card .cap{padding:1.2vh 1.2vw 1.3vh;background:linear-gradient(180deg,rgba(22,22,26,.4),var(--panel))}
.card .cap .cat{display:flex;align-items:center;gap:.45vw;color:var(--muted);font-size:1.55vh;letter-spacing:.16vw;text-transform:uppercase;margin-bottom:.45vh}
.card .cap .cat .cic{width:2.3vh;height:2.3vh;color:var(--red);flex:0 0 auto}
.card .nm{font-family:'Anton';font-size:3.2vh;line-height:.98;color:var(--cream);letter-spacing:.3px;margin-bottom:.5vh;text-transform:uppercase;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .pr{display:flex;align-items:baseline;gap:.35vw;flex-wrap:wrap}
.card .pr .de{font-size:1.75vh;color:var(--muted);text-decoration:line-through;margin-right:.4vw}
.card .pr .cif{font-family:'Anton';font-size:2.2vh;color:var(--red)}
.card .pr .val{font-family:'Anton';font-size:4vh;line-height:.9;color:var(--red);text-shadow:0 0 2vh var(--glow)}
.card .pr .un{font-size:1.7vh;color:var(--muted)}
.card.promo{border-color:rgba(255,26,26,.5)}

.card .photo .bd,.feat .pic .bd{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(2.4vh) brightness(.5) saturate(1.1);transform:scale(1.12);z-index:0;pointer-events:none}
  /* QR card */
.qrcard{width:calc(33.333% - .94vw);height:32vh;background:var(--panel);border:1px solid var(--line);border-radius:1.3vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;padding:1.6vh;box-shadow:0 2.2vh 4.6vh rgba(0,0,0,.55);animation:fadeUp .55s both}
.qrcard .qrimg{height:58%;width:auto;border-radius:1vh;background:#fff;padding:1vh}
.qrcard .qrtxt{text-align:center}
.qrcard .qrtxt b{display:block;font-family:'Anton';font-size:2.5vh;color:var(--cream);text-transform:uppercase}
.qrcard .qrtxt span{font-size:1.7vh;color:var(--muted)}

/* ===== Destaque OFERTA / NOVIDADE (feat) ===== */
.feat{display:flex;align-items:center;gap:4vw;width:100%;max-width:90vw}
.feat .pic{position:relative;flex:0 0 auto;width:44vh;height:44vh;border:.5vh solid var(--red);border-radius:2vh;overflow:hidden;
  box-shadow:0 3vh 7vh rgba(0,0,0,.7),0 0 6vh var(--glow);animation:slideR .9s both}
.feat .pic img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain}
.feat .pic .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#1b1b1f,#0f0f11)}
.feat .meta{flex:1 1 auto;animation:slideL .9s .12s both}
.feat .meta .kick{display:inline-flex;align-items:center;background:var(--red);color:#fff;font-family:'Anton';font-size:2.3vh;
  letter-spacing:.18vw;padding:.9vh 1.8vw;border-radius:.7vh;box-shadow:0 0 2.6vh var(--glow);margin-bottom:1.8vh;text-transform:uppercase}
.feat .meta .cat{display:flex;align-items:center;gap:.6vw;font-size:1.7vh;letter-spacing:.18vw;color:var(--muted);text-transform:uppercase;margin-bottom:.8vh}
.feat .meta .cat .cic{width:2.3vh;height:2.3vh;color:var(--red)}
.feat .meta .nm{font-family:'Anton';font-size:8.4vh;line-height:.84;color:var(--cream);text-shadow:0 .4vh 0 var(--redDeep),0 0 5vh var(--glow);text-transform:uppercase}
.feat .meta .rule{width:9vw;height:.55vh;background:var(--red);box-shadow:0 0 1.6vh var(--glow);margin:1.6vh 0}
.feat .meta .de{font-size:2.2vh;color:var(--muted);text-decoration:line-through;margin-bottom:.4vh}
.feat .priceln{display:flex;align-items:baseline;gap:.5vw;margin-top:.3vh}
.feat .priceln .por{font-size:2.2vh;color:var(--muted);margin-right:.3vw}
.feat .priceln .cif{font-family:'Anton';font-size:4vh;color:var(--red)}
.feat .priceln .val{font-family:'Anton';font-size:13vh;line-height:.76;color:var(--cream);text-shadow:0 0 5vh var(--glow)}
.feat .priceln .un{font-size:2.2vh;color:var(--muted);align-self:flex-end;margin-bottom:1.4vh}
.feat .ate{margin-top:1.6vh;font-size:1.7vh;letter-spacing:.12vw;color:var(--muted)}
.feat .ate b{color:var(--cream);font-weight:600}

/* ===== Telas info ===== */
.info{text-align:center;max-width:78vw;animation:fadeIn .6s both;display:flex;flex-direction:column;align-items:center}
.info .kick{font-size:1.7vh;letter-spacing:.5vw;color:var(--red);font-weight:600;text-transform:uppercase;margin-bottom:1.4vh}
.info h2{font-family:'Anton';font-size:7vh;line-height:.9;color:var(--cream);text-shadow:0 0 5vh var(--glow);text-transform:uppercase}
.info h2 .red,.info .red{color:var(--red)}
.info .rule{width:14vw;height:.55vh;background:var(--red);box-shadow:0 0 1.6vh var(--glow);margin:2vh 0}
.info .lead{font-size:2.6vh;line-height:1.34;color:var(--cream);font-weight:300;max-width:60vw}
.info .lead b{color:var(--red);font-weight:600}
.info .handle{font-family:'Anton';font-size:5vh;color:var(--red);text-shadow:0 0 4vh var(--glow);margin:.6vh 0}
.info .addr{font-size:3vh;color:var(--cream);font-weight:400;margin-bottom:.6vh}
.info .phone{font-family:'Anton';font-size:4.4vh;color:var(--red);text-shadow:0 0 3vh var(--glow)}
.info .qr{margin-top:2.4vh;display:flex;flex-direction:column;align-items:center;gap:1vh}
.info .qr img{width:18vh;height:18vh;border-radius:1.2vh;background:#fff;padding:1vh}
.info .qr span{font-size:1.85vh;color:var(--muted);letter-spacing:.1vw}
.info .hrows{display:flex;flex-direction:column;gap:1.4vh;width:46vw;margin-top:.6vh}
.info .hrow{display:flex;align-items:baseline;gap:1vw;font-size:2.6vh}
.info .hrow b{color:var(--cream);font-weight:600;white-space:nowrap}
.info .hrow .ln{flex:1;border-bottom:2px dotted rgba(255,255,255,.2);transform:translateY(-.7vh)}
.info .hrow span:last-child{font-family:'Anton';color:var(--red);white-space:nowrap}
.info .pays{display:flex;gap:1.2vw;flex-wrap:wrap;justify-content:center;margin-top:.4vh}
.info .pay{background:var(--panel);border:1px solid var(--line);border-radius:1vh;padding:1.4vh 2vw;font-size:2.2vh;color:var(--cream);font-weight:500}
.info .cols{display:flex;gap:1.4vw;justify-content:center;margin-top:.6vh;flex-wrap:wrap}
.info .chip{background:var(--panel);border:1px solid var(--line);border-radius:1.2vh;padding:1.8vh 1.8vw;min-width:18vw}
.info .chip b{display:block;font-family:'Anton';font-size:2.6vh;color:var(--cream);margin-bottom:.4vh}
.info .chip span{font-size:1.6vh;color:var(--muted)}
.info .seal{width:11vh;height:11vh;margin-bottom:1vh;opacity:.85}

/* selo / placeholder de foto */
.seal{display:block}
.ph .seal{width:46%;height:46%;opacity:.5}

/* ===== Clima ===== */
.clima{display:flex;flex-direction:column;align-items:center;text-align:center;animation:fadeIn .6s both;max-width:80vw}
.clima .kick{font-size:1.7vh;letter-spacing:.5vw;color:var(--red);font-weight:600;text-transform:uppercase;margin-bottom:1.6vh}
.clima .climanow{display:flex;align-items:center;gap:1.6vw;margin-bottom:2vh}
.clima .climabig{width:13vh;height:13vh}
.clima .cnT{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.clima .cnTemp{font-family:'Anton';font-size:9vh;color:var(--cream);text-shadow:0 0 5vh var(--glow)}
.clima .cnDesc{font-size:2.4vh;color:var(--muted);letter-spacing:.06vw}
.clima .climastrip{display:flex;gap:1.2vw;margin-bottom:2.2vh}
.clima .cd{background:var(--panel);border:1px solid var(--line);border-radius:1.2vh;padding:1.4vh 1.6vw;display:flex;flex-direction:column;align-items:center;gap:.6vh;min-width:9vw}
.clima .cd.on{border-color:var(--red);box-shadow:0 0 2.4vh rgba(255,26,26,.25)}
.clima .cd b{font-size:1.95vh;color:var(--cream);letter-spacing:.1vw;text-transform:uppercase}
.clima .cd .climasm{width:5vh;height:5vh}
.clima .cd .t{font-family:'Anton';font-size:2.6vh;color:var(--cream)}
.clima .cd .t i{font-style:normal;font-size:1.85vh;color:var(--muted);margin-left:.3vw}
.clima .churras{background:linear-gradient(90deg,rgba(255,26,26,.16),transparent);border-left:.5vh solid var(--red);border-radius:1vh;padding:1.8vh 2.4vw;max-width:64vw}
.clima .churras b{display:block;font-family:'Anton';font-size:3.4vh;color:var(--cream);text-transform:uppercase;margin-bottom:.5vh}
.clima .churras span{font-size:2.1vh;color:var(--muted)}
.clima .churras.alt{background:linear-gradient(90deg,rgba(255,255,255,.05),transparent)}

/* ===== Kit do dia ===== */
.kit{animation:fadeIn .6s both;max-width:86vw;width:100%}
.kit .kick{font-size:1.7vh;letter-spacing:.5vw;color:var(--red);font-weight:600;text-transform:uppercase;text-align:center;margin-bottom:2vh}
.kit .kitgrid{display:flex;gap:3vw;align-items:stretch;justify-content:center}
.kit .kitcombo{flex:1 1 48%;background:var(--panel);border:1px solid var(--line);border-radius:1.6vh;padding:2.4vh 2.4vw;box-shadow:0 2.4vh 5vh rgba(0,0,0,.5)}
.kit .kt{font-family:'Anton';font-size:4.4vh;line-height:.92;color:var(--cream);text-transform:uppercase;text-shadow:0 0 4vh var(--glow);margin-bottom:1.6vh}
.kit .kitcombo ul{list-style:none;display:flex;flex-direction:column;gap:1vh;margin-bottom:1.6vh}
.kit .kitcombo li{font-size:2.1vh;color:var(--cream);padding-left:1.4vw;position:relative}
.kit .kitcombo li::before{content:"";position:absolute;left:0;top:.9vh;width:.7vw;height:.7vw;background:var(--red);border-radius:50%;box-shadow:0 0 1vh var(--glow)}
.kit .kitpreco{display:flex;align-items:baseline;gap:.5vw}
.kit .kitpreco .cif{font-family:'Anton';font-size:3.4vh;color:var(--red)}
.kit .kitpreco .val{font-family:'Anton';font-size:8vh;line-height:.8;color:var(--cream);text-shadow:0 0 5vh var(--glow)}
.kit .kitserve{font-size:1.7vh;color:var(--muted);letter-spacing:.08vw;margin-top:.6vh;text-transform:uppercase}
.kit .kitguia{flex:1 1 48%;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);border:1px solid var(--line);border-radius:1.6vh;padding:2.4vh 2.4vw}
.kit .kgh{font-family:'Anton';font-size:2.8vh;color:var(--cream);text-transform:uppercase;margin-bottom:1.4vh}
.kit .krow{display:flex;align-items:baseline;gap:1vw;font-size:2vh;margin-bottom:1vh}
.kit .krow b{color:var(--cream);font-weight:600;white-space:nowrap}
.kit .krow .ln{flex:1;border-bottom:2px dotted rgba(255,255,255,.2);transform:translateY(-.6vh)}
.kit .krow span:last-child{font-family:'Anton';color:var(--red);white-space:nowrap}
.kit .kgsub{font-size:1.5vh;letter-spacing:.2vw;color:var(--muted);text-transform:uppercase;margin:1.4vh 0 1vh}
.kit .kqtys{display:grid;grid-template-columns:1fr 1fr;gap:1vh 1.4vw}
.kit .kqty{display:flex;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:.9vh;padding:1vh 1.2vw}
.kit .kqty b{font-size:1.7vh;color:var(--cream);font-weight:600}
.kit .kqty span{font-family:'Anton';font-size:1.9vh;color:var(--red)}

/* ===== Rodapé ===== */
footer{flex:0 0 auto;padding:0 3.2vw 2vh}
.foot-info{display:flex;align-items:center;justify-content:space-between;gap:2vw;margin-bottom:1vh}
.dots{display:flex;gap:.7vw;align-items:center}
.dots .d{height:1vh;width:1vh;border-radius:6px;background:rgba(255,255,255,.13);transition:all .5s cubic-bezier(.6,0,.2,1)}
.dots .d.on{width:4.4vh;background:var(--red);box-shadow:0 0 1.6vh var(--glow)}
.foot-info span{font-size:1.6vh;color:var(--muted);letter-spacing:.06vw}
.ticker{overflow:hidden;border-top:1px solid var(--line);padding-top:1vh}
.ticker-track{display:inline-block;white-space:nowrap;font-size:1.95vh;letter-spacing:.2vw;color:var(--muted);text-transform:uppercase;animation:ticker 32s linear infinite}

/* ===== animações ===== */
@keyframes glowDrift{0%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-42%,-44%) scale(1.18)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideR{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes ticker{from{transform:translateX(40vw)}to{transform:translateX(-100%)}}
</style>
</head>
<body>
  <div class="bg-glow"></div>

function montarSequencia(pages,fulls){
  fulls=fulls||[];
  var infoSeq=['fidelidade','instagram','fidelidade','horario','fidelidade','pagamento','fidelidade','endereco'];
  var seq=[],pi=0,ii=0;
  if(!pages.length){
    for(var a=0;a<fulls.length;a++)seq.push(fulls[a]);
    for(var k=0;k<infoSeq.length;k++)seq.push({tipo:'info',id:infoSeq[k]});
    if(!seq.length)seq.push({tipo:'info',id:'fidelidade'});
  }else{
    for(var i=0;i<pages.length;i++){
      seq.push({tipo:'prod',page:pages[i]});
      if(fulls.length&&(i+1)%2===0){seq.push(fulls[pi%fulls.length]);pi++;}
      if((i+1)%3===0){seq.push({tipo:'info',id:infoSeq[ii%infoSeq.length]});ii++;}
    }
    if(ii===0)seq.push({tipo:'info',id:infoSeq[0]});
  }
  var extras=[];
  if(KIT_DIA&&KIT_DIA.ativo)extras.push({tipo:'kit'});
  if(CLIMA&&CLIMA.ok)extras.push({tipo:'clima'});
  if(extras.length){
    if(seq.length){
      var out=[],gap=Math.max(2,Math.floor(seq.length/(extras.length+1))),ei=0;
      for(var s=0;s<seq.length;s++){out.push(seq[s]);if(ei<extras.length&&(s+1)%gap===0)out.push(extras[ei++]);}
      while(ei<extras.length)out.push(extras[ei++]);
      seq=out;
    }else{seq=extras.slice();}
  }
  return seq;
}

function falaAnuncio(){

    _anuncioAudio.onended=volta;

    var pr=_anuncioAudio.play();
    if(pr&&pr.then){pr.then(function(){}).catch(function(){falaTTS(volta);});}

    else{_anuncioUnlocked=true;}

document.addEventListener('click',falaUnlock);
document.addEventListener('keydown',falaUnlock);
document.addEventListener('touchstart',falaUnlock);
falaInit();

var _wakeLock=null;
function keepAwake(){var v=document.getElementById('nosleep');if(v){var pp=v.play();if(pp&&pp.catch)pp.catch(function(){});}if('wakeLock' in navigator && !_wakeLock){try{navigator.wakeLock.request('screen').then(function(w){_wakeLock=w;w.addEventListener('release',function(){_wakeLock=null;});}).catch(function(){});}catch(e){}}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){_wakeLock=null;keepAwake();}});
document.addEventListener('click',keepAwake);document.addEventListener('keydown',keepAwake);
document.addEventListener('keydown',function(e){var k=e.key||e.keyCode;if(k==='MediaPlayPause'||k==='MediaPlay'||k==='MediaPause'||k==='Pause'||k===179||k===415||k===19){if(typeof toggleMusic==='function')toggleMusic();}else if(k==='MediaTrackNext'||k==='MediaNextTrack'||k===176||k===425){if(typeof nextStation==='function')nextStation();}});
keepAwake();
setInterval(keepAwake,60000);
(function(){var t=document.getElementById('tickertrack');if(t){var u=('Preços sujeitos a alteração \u00A0\u00A0\u2022\u00A0\u00A0 ').repeat(8);t.innerHTML='<span>'+u+'</span><span>'+u+'</span>';}})();
tick(); setInterval(tick,1000);
carregarFotos().then(carregar);
carregarClima();
function mostrarPub(){var el=document.getElementById('pub');if(!el)return;fetch(location.href,{method:'HEAD',cache:'no-store'}).then(function(r){var lm=r.headers.get('last-modified');if(lm){var d=new Date(lm);try{el.textContent=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d);}catch(e){el.textContent=d.toLocaleString('pt-BR');}}else{el.textContent='\u2014';}}).catch(function(){el.textContent='\u2014';});}
mostrarPub();
agendarRotacao();
setInterval(carregar, REFRESH_MS);
setInterval(carregarFotos, 21600000);
setInterval(carregarClima, 1800000);
</script>
