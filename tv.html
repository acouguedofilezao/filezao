<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#TABELA DE PREÇOS FILEZÃO</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#0d0d0d;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{background:linear-gradient(135deg,#FE0000,#6D0909);padding:1.7vh 3vw;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 18px rgba(0,0,0,.5);flex:0 0 auto;z-index:2}
  header .brand{display:flex;align-items:center;gap:1.6vw}
  header .brandlogo{height:10vh;width:10vh;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 2px 7px rgba(0,0,0,.45))}
  header .logo{font-size:4.8vh;font-weight:900;letter-spacing:1px;line-height:1.02;text-transform:uppercase;text-shadow:0 2px 6px rgba(0,0,0,.25)}
  header .logo small{display:block;font-size:1.9vh;font-weight:600;letter-spacing:1.5px;opacity:.92;margin-top:.7vh;line-height:1.28}
  header .logo .hc{color:#fff;opacity:1;font-style:normal}
  header .clock{font-size:5vh;font-weight:800;text-align:right;text-shadow:0 2px 5px rgba(0,0,0,.25);line-height:1}
  header .clock small{display:block;font-size:2.4vh;font-weight:600;opacity:.95;margin-top:.7vh}
  header .music{display:flex;align-items:center;gap:1.2vw;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:.8vh 1.8vw .8vh .8vh}
  header .music button{width:9vh;height:9vh;border-radius:50%;border:none;background:#fff;color:#FE0000;font-size:3.7vh;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;line-height:1;box-shadow:0 2px 7px rgba(0,0,0,.35);transition:transform .12s ease}
  header .music button:focus{outline:.6vh solid #ffd400;outline-offset:.4vh;transform:scale(1.08)}
  header .music button:hover{transform:scale(1.08)}
  header .mnext{font-size:3.1vh}
  header .mbtn.off{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  header .minfo{display:flex;flex-direction:column;line-height:1.1;color:#fff;width:17vw;flex:0 0 auto}
  header .minfo small{font-size:1.5vh;opacity:.8;font-weight:700;text-transform:uppercase;letter-spacing:1px}
  header .minfo b{font-size:2.4vh;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  main{flex:1 1 auto;overflow:hidden;padding:1.6vh 2vw;position:relative}
  #stage{height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:1.4vh 1.4vw;transition:opacity .35s ease}
  .qrcard{background:transparent;border:none;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;padding:0;box-shadow:none}
  .qrcard .qrimg{height:30vh;width:auto;max-width:96%;display:block;border-radius:8px}
  .qrcard .qrtxt{text-align:center;line-height:1.12}
  .qrcard .qrtxt b{display:block;font-size:2.3vh;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:.5px;text-shadow:0 2px 5px rgba(0,0,0,.55)}
  .qrcard .qrtxt span{display:block;font-size:1.6vh;font-weight:600;color:#eee;margin-top:.3vh;text-shadow:0 1px 4px rgba(0,0,0,.55)}

  .card{background:#161616;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;border:1px solid #262626;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .card .photo{flex:1 1 auto;position:relative;background:#1d1d1d;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .card .photo img{width:100%;height:100%;object-fit:cover}
  .card .ph-fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;color:#3a3a3a}
  .card .ph-fallback .ic{font-size:7vh}
  .card .cat{position:absolute;top:0;left:0;background:rgba(254,0,0,.92);color:#fff;font-size:1.9vh;font-weight:800;text-transform:uppercase;letter-spacing:1px;padding:.6vh 1.1vw;border-bottom-right-radius:8px}
  .card .bar{flex:0 0 auto;background:#fff;color:#111;padding:1.2vh 1.2vw;display:flex;align-items:center;justify-content:space-between;gap:.6vw}
  .card .nm{font-size:3.4vh;font-weight:800;text-transform:uppercase;line-height:1.05;letter-spacing:.2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
  .card .right{display:flex;align-items:baseline;gap:.3vw;white-space:nowrap}
  .card .cif{font-size:2.7vh;font-weight:800;color:#FE0000}
  .card .val{font-size:5.9vh;font-weight:900;color:#FE0000;line-height:1}
  .card .un{font-size:2.3vh;font-weight:700;color:#999;text-transform:lowercase}

  footer{flex:0 0 auto;display:flex;flex-direction:column;background:#0a0a0a}
  .foot-info{display:flex;align-items:center;justify-content:space-between;padding:.5vh 3vw;font-size:1.3vh;color:#777;letter-spacing:1px}
  .dots{display:flex;gap:.8vw;align-items:center}
  .dots .d{width:1.1vh;height:1.1vh;border-radius:50%;background:#333;transition:all .3s}
  .dots .d.on{background:#FE0000;width:2.4vh;border-radius:1vh}
  .ticker{width:100%;overflow:hidden;white-space:nowrap;background:#6D0909;border-top:.4vh solid #FE0000;padding:.9vh 0}
  .ticker-track{display:inline-block;white-space:nowrap;will-change:transform;animation:ticker 28s linear infinite}
  .ticker-track span{font-size:2.6vh;font-weight:800;letter-spacing:1.5px;color:#fff;text-transform:uppercase}
  @keyframes ticker{from{transform:translateX(-50%)}to{transform:translateX(0)}}

  .center{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2vh}
  .center h2{font-size:4vh;color:#FE0000}
  .center p{font-size:2.2vh;color:#aaa;max-width:60vw;line-height:1.5}

  .promo{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2.4vh;padding:2vh 4vw}
  .promo .pico{font-size:9vh;line-height:1}
  .promo h1{font-size:6.2vh;font-weight:900;text-transform:uppercase;letter-spacing:1px;line-height:1.04;text-shadow:0 3px 10px rgba(0,0,0,.45)}
  .promo .big{color:#FE0000}
  .promo .sub{font-size:3vh;color:#eaeaea;max-width:82vw;line-height:1.32;font-weight:600}
  .promo .sub b{color:#fff}
  .promo .handle{font-size:5vh;font-weight:900;color:#FE0000}
  .promo .pbadge{font-size:2.6vh;font-weight:900;letter-spacing:2px;color:#fff;background:#FE0000;padding:.9vh 2.4vw;border-radius:999px;text-transform:uppercase;box-shadow:0 4px 14px rgba(254,0,0,.45)}
  .promo .prow{display:flex;gap:1.6vw;flex-wrap:wrap;justify-content:center;align-items:stretch;margin-top:1vh}
  .promo .pchip{background:#161616;border:1px solid #2a2a2a;border-radius:14px;padding:1.6vh 2vw;min-width:18vw;display:flex;flex-direction:column;gap:.6vh;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  .promo .pchip b{font-size:3.1vh;color:#FE0000;font-weight:900}
  .promo .pchip span{font-size:2.1vh;color:#ddd;font-weight:600}
  .promo .paychip{background:#fff;color:#111;border-radius:14px;padding:1.8vh 2.4vw;font-size:3.1vh;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  .promo .hgrid{display:flex;flex-direction:column;gap:1.4vh;margin-top:1vh}
  .promo .hrow{display:flex;align-items:center;justify-content:space-between;gap:4vw;background:#161616;border:1px solid #2a2a2a;border-left:.8vh solid #FE0000;border-radius:12px;padding:1.5vh 3vw;min-width:54vw}
  .promo .hrow b{font-size:3.4vh;font-weight:800}
  .promo .hrow span{font-size:3.4vh;font-weight:900;color:#FE0000}
  .promo .qrinline{display:flex;flex-direction:column;align-items:center;gap:1vh}
  .promo .qrinline img{height:25vh;width:auto;border-radius:10px;background:#fff;padding:1vh}
  .promo .qrinline span{font-size:2.2vh;font-weight:700;color:#fff}
</style>
</head>

function z(n){return (n<10?'0':'')+n;}
function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function tick(){var d;try{d=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Sao_Paulo'}));}catch(e){d=new Date();}var dias=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];var meses=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];document.getElementById('hora').textContent=z(d.getHours())+':'+z(d.getMinutes())+':'+z(d.getSeconds());document.getElementById('data').textContent=dias[d.getDay()]+', '+d.getDate()+' de '+meses[d.getMonth()]+' de '+d.getFullYear();var an=document.getElementById('anos');if(an)an.textContent=(d.getFullYear()-1997);}

var PAGES=[], cur=0;

function cardHTML(p){
  var nome=(p.nometv||p.nome||'').toUpperCase();
  var nsz=nome.length>30?'2.3vh':(nome.length>22?'2.7vh':(nome.length>16?'3.0vh':'3.4vh'));
  var un=(p.unidade==='UN')?'un':'kg';
  var cat=catOf(p.id,p.nometv||p.nome);
  var foto=(p.foto||'').trim();
  var photo = foto
    ? '<img src="'+esc(foto)+'" onerror="this.parentNode.innerHTML=fb()">'
    : fb();
  return '<div class="card"><div class="photo"><span class="cat">'+esc(cat)+'</span>'+photo+'</div>'+
    '<div class="bar"><div class="nm" style="font-size:'+nsz+'">'+esc(nome)+'</div>'+
    '<div class="right"><span class="cif">R$</span><span class="val">'+fmtPreco(p.preco)+'</span><span class="un">/'+un+'</span></div></div></div>';
}
function fb(){return '<div class="ph-fallback"><div class="ic">🥩</div></div>';}

function renderDots(){
  var el=document.getElementById('dots');if(!el)return;
  if(SEQ.length<=1){el.innerHTML='';return;}
  var h='';for(var i=0;i<SEQ.length;i++)h+='<div class="d'+(i===cur?' on':'')+'"></div>';
  el.innerHTML=h;
}
function qrUrl(data){return 'https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=0&color=1a1a1a&bgcolor=ffffff&data='+encodeURIComponent(data);}
var QR_SITE=qrUrl('https://casa-de-carnes-filezao.onbeef.app.br/');
var QR_INSTA=qrUrl('https://instagram.com/acouguedofilezao');
var QR_WHATS=qrUrl('https://wa.me/553732870123');
var SEQ=[];
function qrCardHTML(insta){
  var url=insta?QR_INSTA:QR_SITE;
  var b=insta?'Siga no Instagram':'Acesse nosso site';
  var s=insta?'@acouguedofilezao':'e confira todos os nossos produtos';
  return '<div class="qrcard"><img class="qrimg" src="'+url+'" alt="QR" onerror="this.remove()"><div class="qrtxt"><b>'+b+'</b><span>'+s+'</span></div></div>';
}

function montarSequencia(pages){
  var infoSeq=['fidelidade','instagram','fidelidade','horario','fidelidade','pagamento','fidelidade','endereco'];
  var seq=[],ii=0;
  if(!pages.length){for(var k=0;k<infoSeq.length;k++)seq.push({tipo:'info',id:infoSeq[k]});return seq;}
  for(var i=0;i<pages.length;i++){
    seq.push({tipo:'prod',page:pages[i]});
    if((i+1)%2===0){seq.push({tipo:'info',id:infoSeq[ii%infoSeq.length]});ii++;}
  }
  if(ii===0){seq.push({tipo:'info',id:'fidelidade'});seq.push({tipo:'info',id:'instagram'});}
  return seq;
}
function showPage(){
  var stage=document.getElementById('stage');
  var sl=SEQ[cur]||{tipo:'info',id:'fidelidade'};
  if(sl.tipo==='prod'){
    stage.style.display='grid';
    stage.innerHTML=sl.page.map(cardHTML).join('')+qrCardHTML(cur%2===1);
  }else{
    stage.style.display='block';
    stage.innerHTML=infoHTML(sl.id);
  }
  renderDots();
  var d=new Date();document.getElementById('upd').textContent=z(d.getHours())+':'+z(d.getMinutes());
}
function rotate(){
  if(SEQ.length<=1)return;
  var stage=document.getElementById('stage');
  stage.style.opacity='0';
  setTimeout(function(){cur=(cur+1)%SEQ.length;showPage();stage.style.opacity='1';},350);
}

function montarPaginas(rows){
  rows.sort(function(a,b){
    var ca=catOf(a.id,a.nometv||a.nome), cb=catOf(b.id,b.nometv||b.nome);
    if(ca!==cb)return catRank(ca)-catRank(cb);
    var na=(a.nometv||a.nome||'').toUpperCase(), nb=(b.nometv||b.nome||'').toUpperCase();
    return na<nb?-1:na>nb?1:0;
  });
  var pages=[];for(var i=0;i<rows.length;i+=PER_PAGE)pages.push(rows.slice(i,i+PER_PAGE));
  return pages;
}

async function carregar(){
  try{
    var url=SB_URL+'/rest/v1/produtos?select=id,nome,nometv,unidade,preco,exibir,foto&exibir=eq.true';
    var r=await fetch(url,{headers:HDR});
    if(!r.ok)throw new Error('HTTP '+r.status);
    var rows=await r.json();
    rows=rows.filter(function(p){return Number(p.preco)>0;});
    if(!rows.length){
      PAGES=[];SEQ=montarSequencia([]);if(cur>=SEQ.length)cur=0;showPage();return;
    }
    PAGES=montarPaginas(rows);
    SEQ=montarSequencia(PAGES);
    if(cur>=SEQ.length)cur=0;
    showPage();
  }catch(e){
    document.getElementById('stage').style.display='block';
    document.getElementById('stage').innerHTML='<div class="center"><h2>Sem conexão</h2><p>Não consegui carregar os preços agora. Vou tentar de novo em alguns segundos.</p></div>';
  }
}

var RADIO_TAGS=['sertanejo','forro','pagode'];
var RADIO_API='https://de1.api.radio-browser.info';
var RADIO_FALLBACK=[
  {nome:'Groove Salad (lounge)', url:'https://ice1.somafm.com/groovesalad-128-mp3'},
  {nome:'Seven Inch Soul (soul/funk)', url:'https://ice1.somafm.com/7soul-128-mp3'}
];
var RADIOS=[];
var mplayer=new Audio(); mplayer.preload='none'; var MVOL=1; (function(){var v=parseFloat(lsGet('vol'));if(!isNaN(v)&&v>=0&&v<=1)MVOL=v;})(); mplayer.volume=MVOL;
var mcur=0, mplaying=false, mWantPlay=false, mTries=0, mFail=null;
function lsSet(k,v){try{localStorage.setItem('filezao_'+k,v);}catch(e){}}
function lsGet(k){try{return localStorage.getItem('filezao_'+k);}catch(e){return null;}}
function mShuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function mUpd(){var b=document.getElementById('mbtn');if(b){b.textContent=mplaying?'❚❚':'▶';b.className='mbtn '+(mplaying?'on':'off');}var s=document.getElementById('mstation');if(s)s.textContent=RADIOS.length?RADIOS[mcur].nome:'Carregando rádios...';}
function mClearFail(){if(mFail){clearTimeout(mFail);mFail=null;}}
function loadStation(i){if(!RADIOS.length)return;mClearFail();mcur=((i%RADIOS.length)+RADIOS.length)%RADIOS.length;mplayer.src=RADIOS[mcur].url;lsSet('radio',RADIOS[mcur].url);lsSet('radio_nome',RADIOS[mcur].nome||'');mUpd();}
function mSkip(){mTries++;if(mTries>RADIOS.length){mplaying=false;mClearFail();var s=document.getElementById('mstation');if(s)s.textContent='Nenhuma rádio disponível';mUpd();return;}loadStation(mcur+1);if(mWantPlay)mPlay();}
function mPlay(){
  mClearFail();
  mplayer.volume=MVOL;
  var p=mplayer.play();
  if(p&&p.then){p.then(function(){mplaying=true;mTries=0;mUpd();}).catch(function(err){mplaying=false;mUpd();if(err&&err.name!=='NotAllowedError'&&mWantPlay)mSkip();});}
  if(mWantPlay){mFail=setTimeout(function(){if(mplayer.paused||mplayer.readyState<3)mSkip();},9000);}
}
function toggleMusic(){if(!RADIOS.length)return;if(mplaying){mWantPlay=false;mplayer.pause();mplaying=false;mClearFail();lsSet('playing','0');mUpd();return;}mWantPlay=true;if(!mplayer.src)loadStation(mcur);mTries=0;mPlay();}
function nextStation(){if(!RADIOS.length)return;mWantPlay=true;mTries=0;loadStation(mcur+1);mPlay();}
function armFirstGesture(){function go(){document.removeEventListener('click',go);document.removeEventListener('keydown',go);if(!mplaying&&mWantPlay){mTries=0;mPlay();}}document.addEventListener('click',go);document.addEventListener('keydown',go);}
function mAutoResume(){if(lsGet('playing')!=='1'){mUpd();return;}mWantPlay=true;var p=mplayer.play();if(p&&p.then){p.then(function(){mplaying=true;mTries=0;mUpd();}).catch(function(){mplaying=false;mUpd();armFirstGesture();});}else{armFirstGesture();}}
mplayer.addEventListener('playing',function(){mplaying=true;mTries=0;mClearFail();lsSet('playing','1');mUpd();});
mplayer.addEventListener('error',function(){if(mWantPlay)mSkip();});
/* troca de estação só manual (botão Trocar / tecla do controle) — sem rodízio automático */
var RADIO_REGIONAIS=['Nova Sertaneja','A Sertaneja','Espacial FM','Radio Santana Itauna','Montense FM'];
var RADIO_PODE_MISSA=[];
var MISSA_JANELAS=[
  {dias:[0],ini:[7,0],fim:[8,30]},
  {dias:[1,2,3,4,5,6],ini:[6,0],fim:[6,45]},
  {dias:[1,2,3,4,5,6],ini:[18,0],fim:[18,45]}
];
function emMissa(){var d=new Date(),dow=d.getDay(),mn=d.getHours()*60+d.getMinutes();for(var i=0;i<MISSA_JANELAS.length;i++){var w=MISSA_JANELAS[i];if(w.dias.indexOf(dow)<0)continue;if(mn>=w.ini[0]*60+w.ini[1]&&mn<w.fim[0]*60+w.fim[1])return true;}return false;}
function ehSegura(st){if(!st)return true;if(st.safe===false)return false;var n=(st.nome||'').toLowerCase();for(var i=0;i<RADIO_PODE_MISSA.length;i++){if(RADIO_PODE_MISSA[i]&&n.indexOf(RADIO_PODE_MISSA[i])>=0)return false;}return true;}
function checaMissa(){if(!mWantPlay||RADIOS.length<2)return;if(emMissa()&&!ehSegura(RADIOS[mcur])){for(var i=1;i<=RADIOS.length;i++){var k=(mcur+i)%RADIOS.length;if(ehSegura(RADIOS[k])){mTries=0;loadStation(k);mPlay();break;}}}}
setInterval(checaMissa,30000);
function rbFiltra(arr,seen,list){if(!arr||!arr.length)return;arr.forEach(function(s){var u=s.url_resolved||s.url;if(u&&s.lastcheckok===1&&u.indexOf('https://')===0&&!seen[u]&&(s.countrycode==='BR'||!s.countrycode)){seen[u]=1;list.push({nome:((s.name||'Rádio').replace(/\s+/g,' ').trim()).slice(0,38),url:u});}});}
function loadRadios(){
  var seen={},regs=[],gen=[],pend=RADIO_REGIONAIS.length+RADIO_TAGS.length;
  function finish(){pend--;if(pend>0)return;var all=regs.concat(mShuffle(gen));RADIOS=all.length?all.slice(0,18):RADIO_FALLBACK.slice();var start=0;var saved=lsGet('radio');if(saved){var idx=-1;for(var i=0;i<RADIOS.length;i++){if(RADIOS[i].url===saved){idx=i;break;}}if(idx>=0){start=idx;}else{RADIOS.unshift({nome:(lsGet('radio_nome')||'Última estação'),url:saved});start=0;}}loadStation(start);checaMissa();mAutoResume();}
  RADIO_REGIONAIS.forEach(function(nm){fetch(RADIO_API+'/json/stations/byname/'+encodeURIComponent(nm)+'?hidebroken=true&order=votes&reverse=true&limit=3').then(function(r){return r.json();}).then(function(arr){rbFiltra(arr,seen,regs);finish();}).catch(function(){finish();});});
  RADIO_TAGS.forEach(function(tag){fetch(RADIO_API+'/json/stations/search?tag='+tag+'&hidebroken=true&order=clickcount&reverse=true&limit=15').then(function(r){return r.json();}).then(function(arr){rbFiltra(arr,seen,gen);finish();}).catch(function(){finish();});});
}
mUpd();
loadRadios();

var _wakeLock=null;
function keepAwake(){var v=document.getElementById('nosleep');if(v){var pp=v.play();if(pp&&pp.catch)pp.catch(function(){});}if('wakeLock' in navigator && !_wakeLock){try{navigator.wakeLock.request('screen').then(function(w){_wakeLock=w;w.addEventListener('release',function(){_wakeLock=null;});}).catch(function(){});}catch(e){}}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){_wakeLock=null;keepAwake();}});
document.addEventListener('click',keepAwake);document.addEventListener('keydown',keepAwake);
document.addEventListener('keydown',function(e){var k=e.key||e.keyCode;if(k==='MediaPlayPause'||k==='MediaPlay'||k==='MediaPause'||k==='Pause'||k===179||k===415||k===19){if(typeof toggleMusic==='function')toggleMusic();}else if(k==='MediaTrackNext'||k==='MediaNextTrack'||k===176||k===425){if(typeof nextStation==='function')nextStation();}});
keepAwake();
(function(){var t=document.getElementById('tickertrack');if(t){var u=('Preços sujeitos a alteração \u00A0\u00A0\u2022\u00A0\u00A0 ').repeat(8);t.innerHTML='<span>'+u+'</span><span>'+u+'</span>';}})();
tick(); setInterval(tick,1000);
carregar();
function mostrarPub(){var el=document.getElementById('pub');if(!el)return;fetch(location.href,{method:'HEAD',cache:'no-store'}).then(function(r){var lm=r.headers.get('last-modified');if(lm){var d=new Date(lm);try{el.textContent=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d);}catch(e){el.textContent=d.toLocaleString('pt-BR');}}else{el.textContent='\u2014';}}).catch(function(){el.textContent='\u2014';});}
mostrarPub();
setInterval(rotate, ROTACAO_MS);
setInterval(carregar, REFRESH_MS);
</script>
